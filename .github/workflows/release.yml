name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., `0.1.0-alpha.1`, `0.1.0-beta.1`, `0.1.0`.)'
        required: true
      prerelease:
        description: 'Mark as prerelease?'
        type: boolean
        default: false

env:
  python-version: 3.15

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.0.11902837"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.11902837" >> "$GITHUB_ENV"

      - name: Setup Android signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          set -euo pipefail
          cd src-tauri/gen/android
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          keytool -list -keystore "$RUNNER_TEMP/keystore.jks" -storepass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          cat > keystore.properties <<EOF
          keyAlias=$ANDROID_KEY_ALIAS
          password=$ANDROID_KEY_PASSWORD
          storeFile=$RUNNER_TEMP/keystore.jks
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install JavaScript dependencies
        run: pnpm install

      - name: Build APK Release
        run: npm run tauri android build -- --apk

      - name: Build APK Debug
        run: npm run tauri android build -- --apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/**/*.apk

  finalize:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python (${{ env.python-version }})
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python-version }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create Git Tag (if not exists)
        run: |
          git fetch --tags
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag already exists"
          else
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git tag -a ${{ inputs.version }} -m "Release ${{ inputs.version }}"
            git push origin ${{ inputs.version }}
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          name: 'SolarLanDroid: ${{ inputs.version }}'
          body: |
            # SolarLanDroid version; ${{ inputs.version }}
            Check out the changelogs here! [@CHANGELOGS.md](https://github.com/Team-SolarEngine/solarlandroid/blob/main/CHANGELOGS.md)
          files: |
            artifacts/**/*.apk

      - name: Push Discord Webhoook
        run: |
            python python/webhook.py \
              ${{ secrets.DISCORD_WEBHOOK_URL }} \
              ${{ inputs.version }} \
              false